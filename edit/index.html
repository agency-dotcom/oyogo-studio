<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Oyogo Edit — the wellness hotels and residences worth knowing</title>
<meta name="description" content="The Oyogo Edit — the wellness hotels and residences worth knowing about. One property, one thesis, every Sunday. Free, from Oyogo — the leading voice in wellbeing tourism." />
<link rel="canonical" href="https://oyogostudio.com/edit/" />
<meta name="robots" content="index,follow" />
<meta property="og:title" content="The Oyogo Edit" />
<meta property="og:description" content="The wellness hotels and residences worth knowing about. One property, one thesis, every Sunday." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://oyogostudio.com/edit/" />
<meta property="og:image" content="https://oyogostudio.com/pg18.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#20201E;--gold:#cdb100;--serif:'Playfair Display',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:#fff;background:var(--ink)}
  .wrap{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 22px;text-align:center;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,13,.58),rgba(14,15,13,.34) 42%,rgba(14,15,13,.78))}
  .back{position:absolute;top:22px;left:24px;z-index:3;color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;letter-spacing:.4px}
  .back:hover{color:#fff}
  .inner{position:relative;z-index:2;max-width:660px}
  .brand{font-family:var(--serif);font-size:19px;letter-spacing:.5px;margin-bottom:38px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5.6vw,56px);line-height:1.06;letter-spacing:-.5px}
  .promise{font-size:clamp(16px,1.9vw,19px);line-height:1.55;color:rgba(255,255,255,.9);margin:20px auto 0;max-width:34ch}
  .card{background:#fff;border-radius:14px;padding:8px;margin:32px auto 0;max-width:480px;box-shadow:0 22px 60px rgba(0,0,0,.32)}
  .card iframe{width:100%;border:0;display:block;border-radius:9px}
  .fine{font-size:13px;color:rgba(255,255,255,.72);margin-top:20px;line-height:1.5}
  .alt{margin-top:14px;font-size:13px}
  .alt a{color:#fff;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <img class="bg" src="/pg18.jpg" alt="" />
    <div class="scrim"></div>
    <a class="back" href="/">&larr; oyogostudio.com</a>
    <div class="inner">
      <div class="brand">oyogo</div>
      <div class="eyebrow">The Oyogo Edit</div>
      <h1>The wellness hotels and residences worth knowing about.</h1>
      <p class="promise">One property. One thesis. Every Sunday. Free, from the leading voice in wellbeing tourism.</p>
      <div class="card">
        <iframe src="https://theoyogoedit.substack.com/embed" height="150" scrolling="no" title="Subscribe to The Oyogo Edit"></iframe>
      </div>
      <p class="fine">Join a global community that lives wellness. No spam — unsubscribe anytime.</p>
      <p class="alt"><a href="https://theoyogoedit.substack.com/subscribe" target="_blank" rel="noopener">Or subscribe on Substack &rarr;</a></p>
    </div>
  </div>
</body>
</html>
